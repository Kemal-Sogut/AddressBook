<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Address Books</title></head>
<body>
<h1>Address Books</h1>
<table border="1">
    <tr><th>ID</th><th>Buddies</th></tr>
    <tr th:each="book : ${books}">
        <td><a th:href="@{/addressbook/{id}(id=${book.id})}" th:text="${book.id}">1</a></td>
        <td th:text="${book.size()}">0</td>
    </tr>
</table>

<form th:action="@{/addressbook}" method="post">
    <button type="submit">Create address book</button>
</form>
</body>
</html>
